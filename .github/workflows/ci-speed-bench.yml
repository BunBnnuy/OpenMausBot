# Never merged: Linux shards with files side by side, twice at four workers and once at three.
name: CI speed bench
on:
  push:
    branches: ["ci/speed-bench-3"]
permissions:
  contents: read
concurrency:
  group: ci-speed-bench-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { name: w4a-shard1, shard: 1, workers: 4 }
          - { name: w4a-shard2, shard: 2, workers: 4 }
          - { name: w4a-shard3, shard: 3, workers: 4 }
          - { name: w4a-shard4, shard: 4, workers: 4 }
          - { name: w4a-shard5, shard: 5, workers: 4 }
          - { name: w4a-shard6, shard: 6, workers: 4 }
          - { name: w4a-shard7, shard: 7, workers: 4 }
          - { name: w4a-shard8, shard: 8, workers: 4 }
          - { name: w4b-shard1, shard: 1, workers: 4 }
          - { name: w4b-shard2, shard: 2, workers: 4 }
          - { name: w4b-shard3, shard: 3, workers: 4 }
          - { name: w4b-shard4, shard: 4, workers: 4 }
          - { name: w4b-shard5, shard: 5, workers: 4 }
          - { name: w4b-shard6, shard: 6, workers: 4 }
          - { name: w4b-shard7, shard: 7, workers: 4 }
          - { name: w4b-shard8, shard: 8, workers: 4 }
          - { name: w3-shard1, shard: 1, workers: 3 }
          - { name: w3-shard2, shard: 2, workers: 3 }
          - { name: w3-shard3, shard: 3, workers: 3 }
          - { name: w3-shard4, shard: 4, workers: 3 }
          - { name: w3-shard5, shard: 5, workers: 3 }
          - { name: w3-shard6, shard: 6, workers: 3 }
          - { name: w3-shard7, shard: 7, workers: 3 }
          - { name: w3-shard8, shard: 8, workers: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --input-type=commonjs -e "require('electron')"
      - name: Run
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
          OMB_VITEST_E2E: all
          OMB_VITEST_SUBSET: ""
          OMB_VITEST_WORKERS: ${{ matrix.workers }}
        run: .github/bench/run.sh ${{ matrix.name }} pnpm exec vitest run --shard=${{ matrix.shard }}/8 --reporter=default --reporter=github-actions
