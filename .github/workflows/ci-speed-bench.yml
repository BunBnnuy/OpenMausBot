# Never merged: Linux's whole suite in one process on one Boat VM, side by side. One Boat start.
name: CI speed bench
on:
  push:
    branches: ["ci/speed-bench-boat"]
permissions:
  contents: read
concurrency:
  group: ci-speed-bench-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: boat-xlarge
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: boat-xlarge-w16, args: "--fileParallelism --maxWorkers=16" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Remove what Boat installs and GitHub's runners lack
        run: sudo rm -f /usr/bin/bwrap /usr/local/bin/{agent,claude,codex,cua-driver,cursor-agent,hermes,hermes-acp,hermes-agent,kimi,openclaw,opencode,pi,prime-agent,vibe,vibe-acp}
      - run: node --input-type=commonjs -e "require('electron')"
      - name: Machine
        run: nproc; free -m; node -v; cat /proc/sys/net/ipv4/ip_local_port_range; id
      - name: Run
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
          OMB_VITEST_E2E: all
          OMB_VITEST_SUBSET: ""
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          TZ: UTC
        shell: setpriv --inh-caps=-all --ambient-caps=-all -- env -u DISPLAY -u XAUTHORITY bash --noprofile --norc -eo pipefail {0}
        run: .github/bench/run.sh ${{ matrix.name }} pnpm exec vitest run ${{ matrix.args }} --reporter=default --reporter=github-actions
